<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Masuk — Traffic Pekerjaan KSP</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650;700&display=swap">
<style>
  :root{
    --bg:#fafafa; --surface:#ffffff; --surface-2:#f7f7f8; --surface-3:#f4f4f5;
    --border:#ececee; --border-2:#e4e4e7;
    --ink:#09090b; --ink-2:#3f3f46; --ink-3:#71717a; --ink-muted:#a1a1aa;
    --c1:#2E6CA4; --c1-hover:#255d94; --c1-soft:#eaf1f8;
    --bad:#dc2626; --bad-bg:#fdecec; --bad-ink:#b91c1c;
    --good:#16a34a;
    --shadow:0 1px 3px rgba(9,9,11,.06), 0 10px 40px -12px rgba(9,9,11,.14);
    --radius:14px;
    color-scheme:light;
  }
  :root:not([data-theme="light"]){ @media (prefers-color-scheme:dark){
    --bg:#090909; --surface:#0f0f10; --surface-2:#161618; --surface-3:#1c1c1f;
    --border:#232326; --border-2:#2a2a2e;
    --ink:#fafafa; --ink-2:#d4d4d8; --ink-3:#a1a1aa; --ink-muted:#71717a;
    --c1-soft:#132535; --bad-bg:#2e1414;
    --shadow:0 1px 3px rgba(0,0,0,.5), 0 10px 40px -12px rgba(0,0,0,.7);
    color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#090909; --surface:#0f0f10; --surface-2:#161618; --surface-3:#1c1c1f;
    --border:#232326; --border-2:#2a2a2e;
    --ink:#fafafa; --ink-2:#d4d4d8; --ink-3:#a1a1aa; --ink-muted:#71717a;
    --c1-soft:#132535; --bad-bg:#2e1414;
    --shadow:0 1px 3px rgba(0,0,0,.5), 0 10px 40px -12px rgba(0,0,0,.7);
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    letter-spacing:-.006em; -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .wrap{width:100%; max-width:392px;}
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:30px 30px 26px;
  }
  .brand{display:flex; align-items:center; gap:11px; margin-bottom:22px;}
  .brand-mark{
    width:38px; height:38px; border-radius:10px; flex:0 0 38px; background:var(--ink); color:var(--surface);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; letter-spacing:-.5px;
  }
  .brand-text b{display:block; font-size:14px; font-weight:600; line-height:1.2;}
  .brand-text span{display:block; font-size:11.5px; color:var(--ink-muted);}
  h1{font-size:20px; font-weight:650; margin:0 0 4px; letter-spacing:-.02em;}
  .sub{font-size:13px; color:var(--ink-3); margin:0 0 22px;}
  label{display:block; font-size:12.5px; font-weight:550; margin:0 0 6px; color:var(--ink-2);}
  .field{margin-bottom:15px;}
  .input-wrap{position:relative;}
  input[type=email], input[type=password], input[type=text]{
    width:100%; padding:10px 12px; font-size:13.5px; font-family:inherit; color:var(--ink);
    background:var(--surface-2); border:1px solid var(--border-2); border-radius:9px; outline:none;
    transition:border-color .12s, box-shadow .12s;
  }
  input:focus{border-color:var(--c1); box-shadow:0 0 0 3px var(--c1-soft);}
  .toggle-pw{
    position:absolute; right:8px; top:50%; transform:translateY(-50%); border:0; background:transparent;
    color:var(--ink-muted); cursor:pointer; padding:5px; display:flex; border-radius:6px;
  }
  .toggle-pw:hover{color:var(--ink-2);}
  .row{display:flex; align-items:center; justify-content:space-between; margin:2px 0 20px; font-size:12.5px;}
  .remember{display:flex; align-items:center; gap:7px; color:var(--ink-2); cursor:pointer; user-select:none;}
  .remember input{width:15px; height:15px; accent-color:var(--c1); cursor:pointer;}
  .btn{
    width:100%; padding:11px; font-size:14px; font-weight:600; font-family:inherit; color:#fff;
    background:var(--c1); border:0; border-radius:9px; cursor:pointer; transition:background .12s;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn:hover{background:var(--c1-hover);}
  .btn:disabled{opacity:.65; cursor:not-allowed;}
  .spinner{width:15px; height:15px; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:99px; animation:spin .6s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .alert{
    display:none; align-items:center; gap:8px; background:var(--bad-bg); color:var(--bad-ink);
    border:1px solid color-mix(in srgb, var(--bad) 25%, transparent); border-radius:9px;
    padding:9px 12px; font-size:12.5px; margin-bottom:16px;
  }
  .alert.show{display:flex;}
  .foot{text-align:center; font-size:11.5px; color:var(--ink-muted); margin-top:18px;}
  .secure{display:inline-flex; align-items:center; gap:5px; color:var(--ink-3);}
  @media (prefers-reduced-motion: reduce){ .spinner{animation:none;} }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="brand">
        <div class="brand-mark">AW</div>
        <div class="brand-text"><b>AISCHO · AIO-KSP</b><span>Traffic Pekerjaan</span></div>
      </div>
      <h1>Masuk ke Dashboard</h1>
      <p class="sub">Akses terbatas untuk admin AISCHO.</p>

      <div class="alert" id="alert">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
        <span id="alertMsg">Email atau kata sandi salah.</span>
      </div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="username" placeholder="admin@alwildan.id" required>
        </div>
        <div class="field">
          <label for="password">Kata Sandi</label>
          <div class="input-wrap">
            <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" required>
            <button type="button" class="toggle-pw" id="togglePw" aria-label="Tampilkan kata sandi">
              <svg id="eye" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="row">
          <label class="remember"><input type="checkbox" id="remember" checked> Ingat saya</label>
        </div>
        <button type="submit" class="btn" id="submitBtn">Masuk</button>
      </form>

      <div class="foot">
        <span class="secure">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          Koneksi aman · Better Auth
        </span>
      </div>
    </div>
  </div>

<script>
  const form = document.getElementById('loginForm');
  const alertBox = document.getElementById('alert');
  const alertMsg = document.getElementById('alertMsg');
  const btn = document.getElementById('submitBtn');
  const pw = document.getElementById('password');

  document.getElementById('togglePw').addEventListener('click', () => {
    const show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    document.getElementById('eye').innerHTML = show
      ? '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-6.5 0-10-7-10-7a17.6 17.6 0 014.06-5.06M9.9 4.24A9.1 9.1 0 0112 4c6.5 0 10 7 10 7a17.6 17.6 0 01-2.16 3.19M1 1l22 22"/>'
      : '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>';
  });

  function showAlert(msg){ alertMsg.textContent = msg; alertBox.classList.add('show'); }
  function hideAlert(){ alertBox.classList.remove('show'); }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideAlert();
    const email = document.getElementById('email').value.trim();
    const password = pw.value;
    const rememberMe = document.getElementById('remember').checked;
    if (!email || !password) { showAlert('Lengkapi email dan kata sandi.'); return; }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Memproses…';
    try {
      const res = await fetch('/api/auth/sign-in/email', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ email, password, rememberMe }),
      });
      if (res.ok) {
        window.location.href = '/';
        return;
      }
      let msg = 'Email atau kata sandi salah.';
      try { const j = await res.json(); if (j && (j.message || j.error)) msg = j.message || j.error; } catch(_) {}
      if (res.status === 429) msg = 'Terlalu banyak percobaan. Coba lagi beberapa saat.';
      showAlert(msg);
    } catch (err) {
      showAlert('Tidak dapat terhubung ke server. Periksa koneksi.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Masuk';
    }
  });
</script>
</body>
</html>
